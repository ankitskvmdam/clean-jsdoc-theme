name: Release

on:
  push:
    tags: ['v*'] # any v-prefixed tag (e.g. v5.0.0, v5.0.0-beta.1) cuts a release

permissions:
  contents: write # create the GitHub release / push per-package tags
  id-token: write # npm provenance + OIDC trusted publishing (token-less path)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history (parity with CI; safe for changeset tooling)

      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@9) from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org' # sets up .npmrc auth for publish

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      # `changeset publish` runs `pnpm publish`, which shells out to the `npm`
      # on PATH, so upgrading the global npm is what makes the token-less
      # publish below work.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # Build first: turbo wires `test`/`typecheck` to depend on `build`, so
      # building explicitly produces the artifacts they need and warms the cache.
      - run: pnpm build

      # FULL test gate. The same suite runs in CI, but it is repeated here so a
      # pushed tag can NEVER publish red code even if it somehow bypassed CI
      # (e.g. a tag pushed directly without the commit going through a PR).
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

      # Choose the npm dist-tag from the git tag: a prerelease tag (one that
      # contains a `-`, e.g. v5.0.0-beta.1) publishes under `next`; a plain
      # stable tag (e.g. v5.0.0) publishes under `latest`.
      - id: disttag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT";
          else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      # `changeset publish` only publishes packages whose package.json version is
      # not yet on npm, so this step is idempotent (safe to re-run) and skips
      # `private` packages (examples/*, docs-site) automatically.
      #
      # Auth is npm **trusted publishing** (OIDC): no token, no secret. The job's
      # `id-token: write` lets npm mint a short-lived credential for this exact
      # repo + workflow file, which each package's Trusted Publisher config on
      # npmjs.com (owner `ankitskvmdam`, repo `clean-jsdoc-theme`, workflow
      # `release.yml`, allowed action `npm publish`) accepts. Provenance is
      # emitted automatically on this path. The former `NPM_TOKEN` path was
      # retired because npm is phasing out 2FA-bypass granular tokens (they
      # lose direct publishing around January 2027, and the one this repo had
      # already stopped working): see
      # https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
      - name: Publish
        run: |
          # In changesets pre mode (.changeset/pre.json present), `changeset
          # publish` controls the dist-tag itself (the pre tag, e.g. `alpha`) and
          # rejects a custom --tag. Outside pre mode, pick latest/next from the
          # git tag.
          if [ -f .changeset/pre.json ]; then
            pnpm changeset publish
          else
            pnpm changeset publish --tag ${{ steps.disttag.outputs.tag }}
          fi
        env:
          NPM_CONFIG_PROVENANCE: true # emit npm provenance attestations
